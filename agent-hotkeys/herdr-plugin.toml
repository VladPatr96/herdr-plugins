# Generated by scripts/gen-manifest.js; edit that script, not this file.
id = "vladpatr96.agent-hotkeys"
name = "Agent Hotkeys"
version = "0.2.0"
min_herdr_version = "0.8.2"
description = "Every agent gets its own hotkey (Alt+1 ... Alt+0, Alt+Q ...) when it starts, shown next to it in the sidebar; press it to jump to that agent."
platforms = ["linux", "macos", "windows"]

# Token metadata is not restored after a server restart, so label again on start.
[[startup]]
command = ["node", "bin/sync.js"]

# Manual resync; also needed right after `herdr plugin link`, which runs no startup hooks.
[[actions]]
id = "sync"
title = "Agent Hotkeys: sync labels"
contexts = ["workspace", "global"]
command = ["node", "bin/sync.js"]

[[events]]
on = "pane.created"
command = ["node", "bin/sync.js"]

[[events]]
on = "pane.agent_detected"
command = ["node", "bin/sync.js"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "bin/sync.js"]

[[events]]
on = "pane.exited"
command = ["node", "bin/sync.js"]

[[events]]
on = "pane.closed"
command = ["node", "bin/sync.js"]

[[events]]
on = "pane.moved"
command = ["node", "bin/sync.js"]

[[events]]
on = "tab.closed"
command = ["node", "bin/sync.js"]

[[events]]
on = "workspace.closed"
command = ["node", "bin/sync.js"]

# One focus action per hotkey slot; `node bin/keys.js` prints the key bindings.

[[actions]]
id = "focus-1"
title = "Agent Hotkeys: focus Alt+1"
contexts = ["workspace", "global"]
command = ["node", "bin/focus.js", "1"]

