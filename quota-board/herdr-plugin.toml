id = "vladpatr96.quota-board"
name = "Quota Board"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "Subscription and API quota for Claude Code, Codex, agy, Grok, OpenCode Go and the DeepSeek API in one Herdr window."
platforms = ["linux", "macos", "windows"]

# The window itself. Overlay keeps it transient: it zooms over the active pane
# and gives focus back when it closes.
[[panes]]
id = "board"
title = "AI quota"
placement = "overlay"
command = ["node", "--no-warnings", "bin/board.js"]

# The same board as a normal pane, split off to the right where the agents are.
# It stays until you close it, so opening it again focuses this one.
[[panes]]
id = "board-side"
title = "AI quota"
placement = "split"
command = ["node", "--no-warnings", "bin/board.js"]

[[actions]]
id = "open"
title = "Quota Board: open"
contexts = ["workspace", "global"]
command = ["node", "bin/open.js"]

[[actions]]
id = "open-side"
title = "Quota Board: open in a side pane"
contexts = ["workspace", "global"]
command = ["node", "bin/open.js", "side"]

[[actions]]
id = "refresh"
title = "Quota Board: refresh quota"
contexts = ["workspace", "global"]
command = ["node", "--no-warnings", "bin/refresh.js"]

[[actions]]
id = "install-statusline"
title = "Quota Board: install the Claude statusLine bridge"
contexts = ["workspace", "global"]
command = ["node", "bin/install-statusline.js"]

[[actions]]
id = "remove-statusline"
title = "Quota Board: remove the Claude statusLine bridge"
contexts = ["workspace", "global"]
command = ["node", "bin/install-statusline.js", "--uninstall"]

# Warm the cache when the server starts, so the window opens with numbers.
[[startup]]
command = ["node", "--no-warnings", "bin/refresh.js"]

# Refresh while you work: a turn on any agent — a different model, a different
# harness — updates the quota behind it. `--if-stale` keeps that to one request
# per TTL (QUOTA_BOARD_TTL_SECONDS, default 120s) however often events fire.
[[events]]
on = "pane.agent_detected"
command = ["node", "--no-warnings", "bin/refresh.js", "--if-stale"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "--no-warnings", "bin/refresh.js", "--if-stale"]

[[events]]
on = "pane.exited"
command = ["node", "--no-warnings", "bin/refresh.js", "--if-stale"]
